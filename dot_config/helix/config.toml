theme = "catppuccin_latte"

[editor]
line-number = "relative"
default-line-ending = "lf"
popup-border = "menu"
color-modes = true
true-color = true
#clipboard-provider = "x-clip"

[editor.statusline]
center = ["version-control", "file-type"]

[editor.lsp]
display-inlay-hints = true

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "hint"

[editor.indent-guides]
render = true

[editor.file-picker]
#hidden = false

[keys.normal]
# like (neo)vim
G = "goto_file_end"
