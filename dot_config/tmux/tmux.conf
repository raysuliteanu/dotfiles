set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',screen-256color:RGB'
set -g default-terminal "screen-256color"
set-option -a terminal-features 'xterm-256color:RGB'

# change default prefix from C-b to C-Space
unbind C-b
set -g prefix C-Space
# C-Space C-Space to send a ctrl-space to the app, not tmux
bind C-Space send-prefix

set -g set-titles on 
set -g set-titles-string "#S : #W #{session_alerts}"

# timeout before tmux sends ESC to the app e.g. (n)vim
set -s escape-time 0
# let tmux receive focus events which it will pass on to the app
set -s focus-events on

# increase history size (from 2,000)
set -g history-limit 100000
set -g status-position top
set -g mouse on
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# rebind defaults %->| (pipe) and "->- (dash) and have the shell start 
# in the same directory as the pane from which the command is executed 
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# keybindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# reload tmux config
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
# toggle maximize current pane
bind -r m resize-pane -Z

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g allow-passthrough on

# plugins - reload with '<prefix>I'
set -g @plugin 'catppuccin/tmux#v2.1.3' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'christoomey/vim-tmux-navigator'

# use fzf to search tmux stuff ... options, commands, windows, sessions, etc.
set -g @plugin 'sainnhe/tmux-fzf'
# FYI about tmux-fzf using env vars: https://github.com/sainnhe/tmux-fzf?tab=readme-ov-file#faq
# <prefix>C-f
TMUX_FZF_LAUNCH_KEY="C-f"

# tmux-fzf-url config
set -g @plugin 'wfxr/tmux-fzf-url'
# default bind: <prefix>u to bring up URL list; override with e.g. ...
# set -g @fzf-url-bind 'x'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# sessionx config 
set -g @plugin 'omerxx/tmux-sessionx'
unbind s
set -g @sessionx-bind s
set -g @sessionx-fzf-builtin-tmux 'off'
# set -g @sessionx-preview-enabled 'false'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-ls-command 'eza --icons --git'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @catppuccin_flavor 'latte'
set -g @catppuccin_window_status_style "rounded"

# upgraded to 'catppuccin/tmux#v2.1.1' then used recommended manual config vs TPM
run $HOME/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# config changed after upgrade; see https://github.com/catppuccin/tmux/issues/291
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-left-length 100
set -g status-right-length 100
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text " #{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"

run $HOME/.config/tmux/plugins/tpm/tpm
